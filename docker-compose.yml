version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: aiops-postgres
    restart: always

    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Winners2005+$s

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: aiops-backend
    restart: always

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: aiops-frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "5173:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - ./frontend:/app

volumes:
  postgres_data: